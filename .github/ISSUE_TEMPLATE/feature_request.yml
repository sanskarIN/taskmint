name: Feature request
description: Suggest an improvement that fits TaskMint's calm, offline-first scope.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and privacy considerations
