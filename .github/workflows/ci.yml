name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  NPM_VERSION: '12.0.2'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Use pinned npm
        run: npm install --global "npm@${NPM_VERSION}" --ignore-scripts
      - name: Verify JavaScript toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Preserve resolved dependency lock
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Format
        run: npm run format:check
      - name: Documentation links
        run: npm run docs:check
      - name: Secret patterns
        run: npm run secrets:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
