name: Lockfile Bootstrap

on:
  push:
    branches:
      - integration/rc7-cross-platform

permissions:
  actions: read
  contents: write

jobs:
  commit-lockfiles:
    if: github.actor == 'sanskarIN'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: integration/rc7-cross-platform
          fetch-depth: 1

      - name: Restore verified hosted lock artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_ARTIFACT_ID: '9504681684'
          CARGO_ARTIFACT_ID: '9504722021'
          NPM_LOCK_SHA256: da2556048830390fba7a2c4f382ae42202ec55298c194b4bf91ae792570faabe
          CARGO_LOCK_SHA256: f6ccc1f203de1ce9a2739374b084a185d099203f0e9a3df477c09fb1d5988a3f
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json && -f src-tauri/Cargo.lock ]]; then
            echo 'Both dependency lockfiles are already tracked.'
            exit 0
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          if [[ ! -f package-lock.json ]]; then
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NPM_ARTIFACT_ID}/zip" \
              --output "$workdir/npm.zip"
            unzip -q "$workdir/npm.zip" -d "$workdir/npm"
            test -f "$workdir/npm/package-lock.json"
            printf '%s  %s\n' "$NPM_LOCK_SHA256" "$workdir/npm/package-lock.json" | sha256sum --check --strict
            cp "$workdir/npm/package-lock.json" package-lock.json
          fi

          if [[ ! -f src-tauri/Cargo.lock ]]; then
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CARGO_ARTIFACT_ID}/zip" \
              --output "$workdir/cargo.zip"
            unzip -q "$workdir/cargo.zip" -d "$workdir/cargo"
            test -f "$workdir/cargo/Cargo.lock"
            printf '%s  %s\n' "$CARGO_LOCK_SHA256" "$workdir/cargo/Cargo.lock" | sha256sum --check --strict
            cp "$workdir/cargo/Cargo.lock" src-tauri/Cargo.lock
          fi

      - name: Commit verified lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git commit -m 'chore: commit verified dependency lockfiles'
          git push origin HEAD:integration/rc7-cross-platform
