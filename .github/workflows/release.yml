name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify release tag and lockfile
        run: node scripts/check-release.mjs "${{ github.ref_name }}"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Quality suite
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Package web build
        run: |
          tar -czf taskmint-web-${{ github.ref_name }}.tar.gz -C dist .
          sha256sum taskmint-web-${{ github.ref_name }}.tar.gz > taskmint-web-${{ github.ref_name }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            taskmint-web-${{ github.ref_name }}.tar.gz
            taskmint-web-${{ github.ref_name }}.tar.gz.sha256
